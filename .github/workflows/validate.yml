name: Validate Ideburen
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ideburen.cli validate
      - run: python -m pytest -q
      - run: python -m ideburen.cli build --out build
      - run: python -m ideburen.cli package --input build --out build/ideburen_tables.gpkg
      - name: Upload QGIS attribute preview (NOT a spatial release)
        uses: actions/upload-artifact@v4
        with:
          name: ideburen-attributes-preview-not-cleared
          path: |
            build/*.csv
            build/*.json
            build/*.gpkg
          retention-days: 30
